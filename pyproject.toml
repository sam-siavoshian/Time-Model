[project]
name = "time-model"
version = "0.1.0"
description = "Chronometric Injection: Time-Conditional Behavior in a Frozen LLM via Per-Layer FiLM"
# Tested on Python 3.11 and 3.12. Upper bounds pinned for reproducibility;
# bump deliberately when verifying against new majors.
requires-python = ">=3.11,<3.14"
dependencies = [
    "jsonlines>=4.0.0,<5.0",
    "numpy>=2.4.4,<3.0",
    "pydantic>=2.13.4,<3.0",
    "tiktoken>=0.12.0,<1.0",
    "torch>=2.11.0,<3.0",
    "tqdm>=4.67.3,<5.0",
    "transformers>=4.46.0,<6.0",
    "accelerate>=0.34.0,<2.0",
    "safetensors>=0.4.0,<1.0",
    "sentencepiece>=0.2.0,<1.0",
    "huggingface-hub>=0.26.0,<2.0",
    "matplotlib>=3.8.0,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
